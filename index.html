<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACC | Live Timing</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #12161d;
      --panel-2: #171d26;
      --line: #27313f;
      --text: #eef3f8;
      --muted: #9aa8b8;
      --soft: #d5dde7;
      --red: #e3303c;
      --red-2: #b91f2d;
      --green: #39c07f;
      --amber: #f4b942;
      --blue: #5aa7ff;
      --shadow: 0 18px 60px rgba(0,0,0,.34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(11,13,16,.58), var(--bg) 640px),
        url("https://images.unsplash.com/photo-1533106418989-88406c7cc8ca?auto=format&fit=crop&w=2200&q=85") center top / cover fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .shell { width: min(1460px, calc(100% - 32px)); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,13,16,.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ef3340, #7e1018);
      box-shadow: 0 10px 24px rgba(227,48,60,.3);
    }

    .mark svg { width: 25px; height: 25px; }
    .nav-links { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a, .ghost-btn {
      color: var(--soft);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      background: transparent;
      border: 1px solid transparent;
    }
    .nav-links a:hover, .ghost-btn:hover { background: rgba(255,255,255,.07); }
    .control-link { border-color: rgba(227,48,60,.55) !important; color: #fff !important; }

    .hero {
      min-height: 560px;
      display: grid;
      align-items: end;
      padding: 86px 0 54px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) 430px;
      gap: 28px;
      align-items: end;
    }

    .eyebrow {
      color: #fff;
      background: rgba(227,48,60,.92);
      border: 1px solid rgba(255,255,255,.18);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 14px;
      max-width: 920px;
      font-size: clamp(42px, 6vw, 84px);
      line-height: .92;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .hero p {
      margin: 0;
      color: var(--soft);
      font-size: 18px;
      max-width: 720px;
      line-height: 1.55;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .btn {
      border: 0;
      color: #fff;
      background: var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      box-shadow: 0 12px 24px rgba(227,48,60,.28);
    }
    .btn:hover { background: #f13a47; }
    .btn.secondary {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: none;
    }
    .btn.dark { background: #202833; box-shadow: none; }
    .btn.small { padding: 9px 11px; min-height: 36px; font-size: 13px; }
    .btn.danger { background: #9f1b25; box-shadow: none; }
    .btn.ok { background: #168b5d; box-shadow: none; }

    .live-card {
      background: rgba(18,22,29,.91);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .live-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(57,192,127,.12);
    }

    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 8px;
      padding: 14px;
    }
    .stat strong { display: block; font-size: 28px; line-height: 1; }
    .stat span { display: block; color: var(--muted); font-size: 12px; margin-top: 7px; text-transform: uppercase; font-weight: 800; }

    main { background: var(--bg); flex: 1 0 auto; }
    section { padding: 52px 0; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 18px;
    }
    h2 { margin: 0; font-size: 32px; text-transform: uppercase; }
    .section-head p { margin: 8px 0 0; color: var(--muted); max-width: 680px; line-height: 1.5; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .tabs, .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tab {
      border: 1px solid var(--line);
      background: #10151c;
      color: var(--soft);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 800;
    }
    .tab.active { background: var(--red); border-color: var(--red); color: #fff; }

    .input, select, textarea {
      width: 100%;
      color: var(--text);
      background: #0e131a;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      min-height: 42px;
      outline: none;
    }
    textarea { min-height: 90px; resize: vertical; }
    label { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; display: grid; gap: 6px; }
    .filters .input, .filters select { min-width: 190px; }

    .table-wrap {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: #0e131a;
    }
    tr:last-child td { border-bottom: 0; }
    .rank { font-size: 20px; font-weight: 900; }
    .pilot { font-weight: 900; }
    .team { color: var(--muted); font-size: 13px; }
    .badge {
      display: inline-flex;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.07);
    }
    .badge.green { color: #8ff1bf; background: rgba(57,192,127,.12); }
    .badge.red { color: #ff9299; background: rgba(227,48,60,.14); }
    .badge.amber { color: #ffd889; background: rgba(244,185,66,.14); }
    .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-family: "SFMono-Regular", Consolas, monospace; }

    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    .metric span { color: var(--muted); font-size: 12px; font-weight: 900; text-transform: uppercase; }
    .metric strong { display: block; font-size: 34px; margin-top: 8px; }

    .race-control {
      background: #080a0d;
      border-top: 1px solid var(--line);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 86px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .side button {
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 8px;
      box-shadow: none;
    }
    .side button:last-child { margin-bottom: 0; }
    .admin-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 420px;
    }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid .wide { grid-column: 1 / -1; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .split { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 14px; margin-top: 14px; }
    .mini-list {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #0e131a;
    }
    .mini-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px;
      border-bottom: 1px solid var(--line);
    }
    .mini-row:last-child { border-bottom: 0; }
    .mini-row button { flex: 0 0 auto; }

    .notice {
      border-left: 4px solid var(--blue);
      background: rgba(90,167,255,.1);
      color: var(--soft);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .empty { color: var(--muted); padding: 22px; text-align: center; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      background: #142016;
      color: #b9ffd7;
      border: 1px solid rgba(57,192,127,.35);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .22s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.52);
      padding: 18px;
    }
    .modal-backdrop.show { display: grid; }
    .login-modal {
      width: min(420px, 100%);
      background: #fff;
      color: #00305f;
      border-radius: 8px;
      border: 1px solid #d8dee3;
      box-shadow: 0 24px 80px rgba(0,0,0,.32);
      padding: 18px;
    }
    .login-modal h3 {
      margin: 0 0 14px;
      color: #00305f;
    }
    .remember-row {
      display: flex;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      color: #00305f;
      font-size: 13px;
      font-weight: 800;
      text-transform: none;
    }
    .remember-row input {
      width: 16px;
      height: 16px;
      accent-color: #00305f;
    }
    .login-modal .admin-actions {
      justify-content: flex-end;
    }

    footer {
      flex-shrink: 0;
      margin-top: auto;
      padding: 28px 0 42px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: #080a0d;
    }

    .atm-body {
      color: #00305f;
      background: #f5f6f7;
      min-height: 100vh;
    }
    .atm-body main {
      background: #f5f6f7;
    }
    .atm-body .race-control {
      background: #f5f6f7;
      border-top: 1px solid #d8dee3;
      color: #00305f;
    }
    .atm-body .race-control .section-head h2 {
      color: #003a70;
    }
    .atm-body .race-control .section-head p {
      color: #596a76;
    }
    .atm-body .race-control .side {
      background: #dce6ec;
      border-color: #cbd7df;
    }
    .atm-body .race-control .admin-panel {
      background: #fff;
      border-color: #d8dee3;
      color: #00305f;
    }
    .atm-body .race-control .admin-panel h3 {
      margin-top: 0;
      color: #003a70;
    }
    .atm-body .race-control .btn.dark {
      background: #e8f0f6;
      color: #00305f;
      border: 1px solid #00305f;
    }
    .atm-body .race-control .btn.dark.active,
    .atm-body .race-control .btn.dark:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }
    .atm-body .race-control .btn {
      box-shadow: none;
    }
    .atm-body .race-control label {
      color: #00305f;
    }
    .atm-body .race-control .input,
    .atm-body .race-control select,
    .atm-body .race-control textarea {
      background: #f8fafb;
      color: #00305f;
      border-color: #cbd7df;
    }
    .atm-body .race-control .mini-list {
      background: #fff;
      border-color: #d8dee3;
    }
    .atm-body .race-control .mini-row {
      border-bottom-color: #d8dee3;
    }
    .atm-body .race-control .team {
      color: #596a76;
    }
    .atm-body .race-control .notice {
      background: #eef4f8;
      color: #00305f;
      border-left-color: #003a70;
    }
    .atm-topbar {
      background: #fff;
      border-bottom: 1px solid #d9dde1;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .atm-topbar .nav {
      min-height: 54px;
    }
    .atm-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #00305f;
      font-size: 25px;
      font-weight: 950;
      font-style: italic;
      letter-spacing: .02em;
    }
    .atm-brand span:first-child {
      border: 2px solid #000;
      border-radius: 3px;
      padding: 0 6px;
      margin-right: 8px;
      color: #000;
      font-style: normal;
    }
    .community-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
    }
    .login-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00305f;
      background: #fff;
      border: 1px solid #00305f;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 900;
      box-shadow: none;
    }
    .public-wrap {
      width: min(1340px, calc(100% - 52px));
      margin: 0 auto;
      padding: 0 0 32px;
    }
    .loading-state {
      min-height: calc(100vh - 154px);
      display: grid;
      place-items: center;
      padding: 36px 18px;
    }
    .loading-card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid #d8dee3;
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: #00305f;
      box-shadow: 0 12px 34px rgba(0,0,0,.1);
    }
    .loading-spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #dce6ec;
      border-top-color: #00305f;
      border-radius: 999px;
      animation: spin .8s linear infinite;
    }
    .loading-card strong {
      display: block;
      font-size: 18px;
      text-transform: uppercase;
    }
    .loading-card span {
      display: block;
      margin-top: 8px;
      color: #596a76;
      font-size: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .public-title {
      margin: 28px 0 18px;
      color: #003a70;
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .back-row {
      display: flex;
      justify-content: flex-start;
      margin: 14px 0 12px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #00305f;
      background: #fff;
      border: 1px solid #cdd8df;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .back-link:hover {
      border-color: #00305f;
      background: #eef4f8;
    }
    .atm-button {
      border: 1px solid #003a70;
      background: #e8f0f6;
      color: #003a70;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 800;
      box-shadow: none;
    }
    .atm-button.active, .atm-button:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }
    .event-strip {
      display: grid;
      grid-template-columns: 220px 1fr 150px;
      align-items: stretch;
      width: 100%;
      min-height: 124px;
      background: #dce6ec;
      border: 1px solid #d7dde2;
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      color: #003a70;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      font: inherit;
      cursor: pointer;
    }
    .event-strip:hover {
      border-color: #aebbc5;
      transform: translateY(-1px);
      transition: .18s ease;
    }
    .event-logo {
      display: grid;
      place-items: center;
      background: #fff;
      padding: 16px;
    }
    .logo-shield {
      width: 166px;
      min-height: 74px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #ff7b19, #003a70);
      border: 4px solid #ff6b00;
      border-radius: 18px;
      font-weight: 950;
      line-height: 1.05;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.35);
    }
    .plate-img {
      max-width: 180px;
      max-height: 92px;
      width: 100%;
      object-fit: contain;
      display: block;
    }
    .event-main {
      display: grid;
      align-content: center;
      gap: 6px;
      padding: 18px 24px;
      text-align: center;
    }
    .event-main h2, .event-main h3 {
      margin: 0;
      color: #003a70;
      font-size: 24px;
    }
    .event-meta {
      color: #000;
      font-size: 15px;
    }
    .event-side {
      display: grid;
      place-items: center;
      background: #cfdbe3;
      color: #003a70;
      font-weight: 900;
      text-transform: uppercase;
      border-left: 1px solid #c4d0d8;
    }
    .event-hero-strip {
      display: grid;
      grid-template-columns: 190px 1fr;
      background: #dce6ec;
      border: 1px solid #d7dde2;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
      min-height: 104px;
    }
    .event-hero-strip .event-main h2 { font-size: 26px; }
    .event-nav {
      margin-top: 10px;
      border-top: 1px solid #e4e7ea;
      background: #dce6ec;
    }
    .event-nav-head {
      display: block;
      text-align: center;
      color: #000;
      font-weight: 900;
      padding: 10px 0 4px;
      border-bottom: 3px solid #000;
    }
    .event-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .section-bar {
      background: #d6e0e7;
      color: #003a70;
      padding: 8px 10px;
      margin: 14px 0 0;
      font-weight: 900;
      text-transform: uppercase;
    }
    .stage-strip {
      display: grid;
      grid-template-columns: 64px 1fr 110px;
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 74px;
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #d8dee3;
      border-left: 0;
      border-right: 0;
      border-top: 0;
      color: #003a70;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .stage-strip:hover { background: #f8fafb; }
    .stage-code {
      display: inline-grid;
      place-items: center;
      min-width: 58px;
      height: 28px;
      border-radius: 4px;
      background: #000;
      color: #fff;
      font-weight: 950;
    }
    .stage-code.live { background: #168b5d; color: #fff; }
    .stage-title {
      font-weight: 950;
      text-transform: uppercase;
    }
    .stage-sub {
      display: block;
      color: #777;
      margin-top: 6px;

      ],

        { id: "ret-1", eventId: "evt-sierra", driverId: "drv-42", stageId: "stg-2", reason: "Daños mecánicos", notes: "No toma salida en TC3" }
      ]
    };

    let data = loadData();
    let currentStage = "general";
    let adminView = "events";
    let publicView = "home";
    let detailTab = "itinerary";
    let selectedStageId = "";
    let categoryFilter = "absolute";
    let directorLoggedIn = sessionStorage.getItem("directorLoggedIn") === "true" || localStorage.getItem("directorLoggedIn") === "true";
    let remoteApplying = false;
    let supabaseClient = null;
    let supabaseChannel = null;
    let supabasePollTimer = null;
    let lastDataFingerprint = "";
    let initialSyncPending = hasSupabaseConfig(data);
    const liveChannel = "BroadcastChannel" in window ? new BroadcastChannel("acc-rally-live") : null;

    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(storeKey));
        return saved ? normalizeData(saved) : structuredClone(defaultData);
      } catch {
        return normalizeData(structuredClone(defaultData));
      }
    }

    function normalizeData(source) {
      const merged = { ...structuredClone(defaultData), ...source, api: { ...defaultData.api, ...(source?.api || {}) } };
      merged.api.supabaseUrl = normalizeSupabaseUrl(merged.api.supabaseUrl);
      merged.events = (merged.events || []).map((event, index) => ({ format: "rally", order: index + 1, ...event }));
      merged.stages = (merged.stages || []).map(stage => ({ countsForGeneral: true, ...stage, countsForGeneral: stage.countsForGeneral !== false }));
      merged.drivers = (merged.drivers || []).map(driver => {
        const categories = Array.isArray(driver.categories)
          ? driver.categories
          : String(driver.category || "").split(",").map(item => item.trim()).filter(Boolean);
        return { codriver: "", ...driver, categories, category: categories[0] || driver.category || "" };
      });
      return merged;
    }

    function normalizeSupabaseUrl(url) {
      return String(url || "").trim().replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
    }

    function hasSupabaseConfig(source = data) {
      const cfg = source.api || {};
      return Boolean(cfg.supabaseUrl && cfg.supabaseAnonKey && cfg.supabaseTable && cfg.supabaseRowId);
    }

    function dataFingerprint(source) {
      try {
        return JSON.stringify(normalizeData(source));
      } catch {
        return "";
      }
    }
    lastDataFingerprint = dataFingerprint(data);

    function saveData(message = "Guardado") {
      try {
        localStorage.setItem(storeKey, JSON.stringify(data));
        lastDataFingerprint = dataFingerprint(data);
        showToast(message);
        renderAll();
        notifyLocalLive();
        persistSupabase();
      } catch (error) {
        showToast("No se pudo guardar. Prueba una placa más ligera.");
        console.error("Error guardando datos", error);
      }
    }

    function applyRemoteData(nextData, message = "Datos actualizados") {
      const normalized = normalizeData(nextData);
      const nextFingerprint = dataFingerprint(normalized);
      if (nextFingerprint && nextFingerprint === lastDataFingerprint) return false;
      remoteApplying = true;
      data = normalized;
      lastDataFingerprint = nextFingerprint;
      localStorage.setItem(storeKey, JSON.stringify(data));
      renderAll();
      if (message) showToast(message);
      remoteApplying = false;
      return true;
    }

    function notifyLocalLive() {
      if (remoteApplying) return;
      liveChannel?.postMessage({ type: "rally-data-updated", data, at: Date.now() });
    }

    liveChannel?.addEventListener("message", event => {
      if (event.data?.type === "rally-data-updated") applyRemoteData(event.data.data, "Actualizado en vivo");
    });

    window.addEventListener("storage", event => {
      if (event.key === storeKey && event.newValue) applyRemoteData(JSON.parse(event.newValue), "Actualizado en vivo");
    });

    async function initSupabaseSync() {
      const cfg = data.api || {};
      if (!hasSupabaseConfig()) {
        initialSyncPending = false;
        renderAll();
        return;
      }
      try {
        await ensureSupabaseClient();
        await fetchSupabaseState("Actualización correcta");
        if (cfg.realtime !== false && !supabaseChannel) {
          supabaseChannel = supabaseClient
            .channel("acc-rally-state")
            .on("postgres_changes", { event: "*", schema: "public", table: cfg.supabaseTable, filter: `id=eq.${cfg.supabaseRowId}` }, payload => {
              if (payload.new?.state) applyRemoteData(payload.new.state, "Actualización correcta");
            })
            .subscribe();
        }
        startSupabasePolling();
      } catch (error) {
        console.warn("Supabase no conectado", error);
      } finally {
        if (initialSyncPending) {
          initialSyncPending = false;
          renderAll();
        }
      }
    }

    async function fetchSupabaseState(message = "") {
      const cfg = data.api || {};
      if (!supabaseClient || !hasSupabaseConfig()) return false;
      const { data: remote, error } = await supabaseClient
        .from(cfg.supabaseTable)
        .select("state,updated_at")
        .eq("id", cfg.supabaseRowId)
        .maybeSingle();
      if (error) throw error;
      return remote?.state ? applyRemoteData(remote.state, message) : false;
    }

    function startSupabasePolling() {
      if (supabasePollTimer) clearInterval(supabasePollTimer);
      if (!hasSupabaseConfig()) return;
      supabasePollTimer = setInterval(() => {
        fetchSupabaseState("Actualización correcta").catch(error => console.warn("Polling Supabase fallido", error));
      }, 5000);
    }

    async function ensureSupabaseClient() {
      const cfg = data.api || {};
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return null;
      if (!supabaseClient) {
        const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
        supabaseClient = mod.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      }
      return supabaseClient;
    }

    async function loginDirectorWithSupabase(email, password) {
      await ensureSupabaseClient();
      if (!supabaseClient) throw new Error("Supabase no está configurado");
      const { data: authData, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      return authData?.user;
    }

    async function logoutDirector() {
      try {
        if (supabaseClient) await supabaseClient.auth.signOut();

      sessionStorage.removeItem("directorLoggedIn");
      localStorage.removeItem("directorLoggedIn");
      renderDirectorAccess();
      showToast("Sesión de director cerrada");

    async function persistSupabase() {
      if (remoteApplying) return;
      const cfg = data.api || {};
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !cfg.supabaseTable || !cfg.supabaseRowId) return;
      try {
        await ensureSupabaseClient();
        if (!supabaseClient) return;
        await supabaseClient
          .from(cfg.supabaseTable)
          .upsert({ id: cfg.supabaseRowId, state: data, updated_at: new Date().toISOString() });
      } catch (error) {
        console.warn("No se pudo sincronizar con Supabase", error);
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1700);

    const byId = (items, id) => items.find(item => item.id === id);
    const activeEvent = () => byId(data.events, data.activeEventId) || data.events[0];
    const activeEventId = () => activeEvent()?.id;
    const eventDrivers = () => data.drivers.filter(item => item.eventId === activeEventId());
    const eventStages = () => data.stages.filter(item => item.eventId === activeEventId());
    const stageCountsForGeneral = stage => stage?.countsForGeneral !== false;
    const generalStageIds = stages => stages.filter(stageCountsForGeneral).map(stage => stage.id);
    const eventTimes = () => data.times.filter(item => item.eventId === activeEventId());

    const driverCategories = driver => Array.isArray(driver.categories) && driver.categories.length ? driver.categories : [driver.category].filter(Boolean);
    const categoryText = driver => driverCategories(driver).join(" / ") || "-";
    const parseCategories = value => String(value || "").split(",").map(item => item.trim()).filter(Boolean);
    const driverLabel = driver => driver ? `#${driver.number} ${driver.name}${driver.codriver ? ` / ${driver.codriver}` : ""}${driver.team ? ` · ${driver.team}` : ""}` : "";
    const driverSearchOptions = () => `<datalist id="driverSearchList">${eventDrivers().map(driver => `<option value="${esc(driverLabel(driver))}"></option>`).join("")}</datalist>`;

    function resolveDriverId(value) {
      const text = String(value || "").trim();
      const exact = eventDrivers().find(driver => driver.id === text || driverLabel(driver) === text);
      if (exact) return exact.id;
      const lowered = text.toLowerCase();
      const partial = eventDrivers().find(driver => driverLabel(driver).toLowerCase().includes(lowered) || String(driver.number).toLowerCase() === lowered);
      return partial?.id || "";
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "-";
      const sign = seconds < 0 ? "-" : "";
      const abs = Math.abs(seconds);
      const hours = Math.floor(abs / 3600);
      const mins = Math.floor((abs % 3600) / 60);
      const secs = abs - hours * 3600 - mins * 60;
      const secondsText = secs.toFixed(2).padStart(5, "0");
      return hours ? `${sign}${hours}:${String(mins).padStart(2, "0")}:${secondsText}` : `${sign}${mins}:${secondsText}`;
    }

    function parseTime(value) {
      const text = String(value || "").trim().replace(",", ".");
      if (!text) return null;
      if (text.includes(":")) {
        const parts = text.split(":").map(Number);
        if (parts.some(Number.isNaN)) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }
      const n = Number(text);
      return Number.isFinite(n) ? n : null;
    }

    function compareClassificationRows(a, b) {
      if (a.hasTime !== b.hasTime) return a.hasTime ? -1 : 1;
      const totalDiff = Number(a.total || 0) - Number(b.total || 0);
      if (totalDiff) return totalDiff;
      return Number(a.driver?.number || 0) - Number(b.driver?.number || 0);
    }

    function sortClassificationRows(rows) {
      return [...rows].sort(compareClassificationRows);
    }

    function classification(stageId = "general") {
      const retireIds = new Set(eventRetirements().map(item => item.driverId));
      const isGeneral = stageId === "general";
      const isHillclimb = activeEvent()?.format === "subida";
      const rows = eventDrivers().map(driver => {
        const driverTimes = eventTimes().filter(time => {
          const stage = byId(data.stages, time.stageId);
          return time.driverId === driver.id && (stageId === "general" ? stageCountsForGeneral(stage) : time.stageId === stageId);
        });
        const driverStageResults = driverTimes.map(time => {
          const penalty = eventPenalties()
            .filter(item => item.driverId === driver.id && item.stageId === time.stageId)
            .reduce((sum, item) => sum + Number(item.seconds || 0), 0);
          const raw = Number(time.seconds || 0);
          return { raw, penalty, total: raw + penalty };
        });
        const scoringResults = isGeneral && isHillclimb
          ? [...driverStageResults].sort((a, b) => a.total - b.total).slice(0, 2)
          : driverStageResults;
        const raw = scoringResults.reduce((sum, item) => sum + item.raw, 0);
        const penalty = scoringResults.reduce((sum, item) => sum + item.penalty, 0);
        return {
          driver,
          raw,
          penalty,
          total: raw + penalty,
          completedStages: scoringResults.length,
          enteredStages: driverTimes.length,
          hasTime: driverTimes.length > 0,
          retired: retireIds.has(driver.id) || driver.status === "Abandono"
        };
      });
      return sortClassificationRows(rows);
    }

    function classificationForStages(stageIds, selectedCategory = "absolute") {
      const stageSet = new Set(stageIds);
      const retireIds = new Set(eventRetirements().map(item => item.driverId));
      const isHillclimbGeneral = activeEvent()?.format === "subida" && stageIds.length > 1;
      const rows = eventDrivers()
        .filter(driver => selectedCategory === "absolute" || driverCategories(driver).includes(selectedCategory))
        .map(driver => {
          const driverTimes = eventTimes().filter(time => time.driverId === driver.id && stageSet.has(time.stageId));
          const driverStageResults = driverTimes.map(time => {
            const penalty = eventPenalties()
              .filter(item => item.driverId === driver.id && item.stageId === time.stageId)
              .reduce((sum, item) => sum + Number(item.seconds || 0), 0);
            const raw = Number(time.seconds || 0);
            return { raw, penalty, total: raw + penalty };
          });
          const scoringResults = isHillclimbGeneral
            ? [...driverStageResults].sort((a, b) => a.total - b.total).slice(0, 2)
            : driverStageResults;
          const raw = scoringResults.reduce((sum, item) => sum + item.raw, 0);
          const penalty = scoringResults.reduce((sum, item) => sum + item.penalty, 0);
          return {
            driver,
            raw,
            penalty,
            total: raw + penalty,
            completedStages: scoringResults.length,
            enteredStages: driverTimes.length,
            hasTime: driverTimes.length > 0,
            retired: retireIds.has(driver.id) || driver.status === "Abandono"
          };
        });
      return sortClassificationRows(rows);
    }

    function driverHasTimesForStages(driverId, stageIds) {
      return stageIds.every(stageId => eventTimes().some(time => time.driverId === driverId && time.stageId === stageId));
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function fileToOptimizedLogo(file) {
      const dataUrl = await fileToDataUrl(file);
      return new Promise(resolve => {
        const image = new Image();
        image.onload = () => {
          const maxWidth = 700;
          const scale = Math.min(1, maxWidth / image.width);
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/webp", 0.86));
        };
        image.onerror = () => resolve(dataUrl);
        image.src = dataUrl;
      });
    }

    async function ensureXlsxLib() {
      if (!window.XLSX) {

      }

    function excelHeaderKey(value) {
      return String(value || "")
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function excelCell(row, headers, names) {
      const keys = names.map(excelHeaderKey);
      const index = headers.findIndex(header => keys.includes(header));
      return index >= 0 ? String(row[index] ?? "").trim() : "";
    }

    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function importDriversFromExcel(input) {
      const file = input?.files?.[0];
      if (!file) return showToast("Selecciona un archivo Excel");
      try {
        const XLSX = await ensureXlsxLib();
        const buffer = await readFileAsArrayBuffer(file);
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (rows.length < 2) return showToast("El Excel no tiene pilotos");

        const headers = rows[0].map(excelHeaderKey);
        let imported = 0;
        let updated = 0;
        rows.slice(1).forEach(row => {
          const number = excelCell(row, headers, ["Dorsal", "Numero", "N"]);
          const name = excelCell(row, headers, ["Piloto", "Nombre"]);
          if (!number || !name) return;
          const previous = data.drivers.find(driver => driver.eventId === activeEventId() && String(driver.number).trim() === number);
          const categories = parseCategories(excelCell(row, headers, ["Categorías", "Categorias", "Categoria", "Categoría"]));
          const item = {
            id: previous?.id || uid("drv"),
            eventId: activeEventId(),
            number,
            name,
            codriver: excelCell(row, headers, ["Copiloto", "Co-piloto", "Navegante"]),
            team: excelCell(row, headers, ["Equipo", "Escuderia", "Escudería"]),
            car: excelCell(row, headers, ["Coche", "Vehiculo", "Vehículo", "Auto"]),
            categories,
            category: categories[0] || "",
            status: previous?.status || "Activo"
          };
          if (previous) {
            data.drivers = data.drivers.map(driver => driver.id === previous.id ? item : driver);
            updated += 1;
          } else {
            data.drivers = [...data.drivers, item];
            imported += 1;
          }
        });

        input.value = "";
        if (!imported && !updated) return showToast("No se encontraron pilotos válidos");
        saveData(`${imported} pilotos importados · ${updated} actualizados`);
      } catch (error) {
        console.error("Error importando Excel", error);
        showToast("No se pudo importar el Excel");
      }
    }

    function reorderEvents(eventId, direction) {
      const ordered = sortedEvents();
      const index = ordered.findIndex(event => event.id === eventId);
      const target = index + direction;
      if (index < 0 || target < 0 || target >= ordered.length) return;
      [ordered[index], ordered[target]] = [ordered[target], ordered[index]];
      ordered.forEach((event, idx) => {
        const original = byId(data.events, event.id);
        if (original) original.order = idx + 1;
      });
      saveData("Orden de eventos actualizado");
    }

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

      }

    function pdfRows(stageIds, category) {
      const rows = sortClassificationRows(classificationForStages(stageIds, category).filter(row =>
        row.hasTime && (activeEvent()?.format === "subida" || stageIds.length <= 1 || driverHasTimesForStages(row.driver.id, stageIds))
      ));
      const leader = rows.find(row => row.hasTime);
      return rows.map((row, index) => {
        const gap = leader ? row.total - leader.total : 0;
        return [
          String(index + 1),
          String(row.driver.number || ""),
          `${row.driver.name || ""}\n${row.driver.codriver || ""}`,
          categoryText(row.driver),
          formatTime(row.total),
          gap ? `+${formatTime(gap)}` : "+0.0"
        ];
      });
    }

    function slug(value) {
      return String(value || "clasificacion").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function addPdfHeader(doc, event, subtitle) {

      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(17);
      doc.text(event.name || "Assetto Corsa Community", 14, 11);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.text(`${event.date || ""} · ${event.location || "Online"} · ${event.format === "subida" ? "Formato subida" : "Formato rally"}`, 14, 18);
      doc.setTextColor(0, 48, 95);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.text(subtitle, 14, 35);
      doc.setDrawColor(0, 48, 95);
      doc.setLineWidth(0.4);
      doc.line(14, 38, 283, 38);
    }

    function addPdfFooter(doc) {
      const pages = doc.internal.getNumberOfPages();
      for (let page = 1; page <= pages; page++) {
        doc.setPage(page);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(90, 106, 118);
        doc.text("Assetto Corsa Community · Tiempos Online.", 14, 203);
        doc.text(`Página ${page} / ${pages}`, 270, 203, { align: "right" });
      }
    }

    function addPdfTable(doc, title, rows, startY) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(0, 48, 95);
      doc.text(title, 14, startY);
      doc.autoTable({
        startY: startY + 4,
        head: [["Pos", "N", "Piloto / copiloto", "Cat", "Tiempo", "Dif"]],
        body: rows.length ? rows : [["-", "-", "Sin tiempos para este filtro", "-", "-", "-"]],
        theme: "grid",
        styles: { font: "helvetica", fontSize: 8, cellPadding: 2.4, lineColor: [218, 224, 230], lineWidth: 0.15, valign: "middle" },
        headStyles: { fillColor: [0, 48, 95], textColor: [255, 255, 255], fontStyle: "bold" },
        alternateRowStyles: { fillColor: [245, 246, 247] },
        columnStyles: {
          0: { halign: "center", cellWidth: 14 },
          1: { halign: "center", cellWidth: 14 },
          2: { cellWidth: 98 },
          3: { cellWidth: 58 },
          4: { halign: "right", cellWidth: 28 },
          5: { halign: "right", cellWidth: 24 }
        },
        margin: { left: 14, right: 14 }
      });
      return doc.lastAutoTable.finalY + 10;
    }

    async function exportPdf(form) {
      const values = Object.fromEntries(new FormData(form).entries());
      const event = activeEvent();
      const category = values.category || "absolute";
      const categoryLabel = category === "absolute" ? "Absoluta" : category;
      const stages = eventStages();
      const jsPDF = await ensurePdfLibs();
      const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const subtitle = `${categoryLabel} · ${new Date().toLocaleDateString("es-ES")}`;
      addPdfHeader(doc, event, subtitle);
      let y = 48;

      if (values.pdfType === "general" || values.pdfType === "all") {
        const title = event.format === "subida" ? "Clasificación general (dos mejores tiempos)" : "Clasificación general";
        y = addPdfTable(doc, title, pdfRows(generalStageIds(stages), category), y);
      }

      if (values.pdfType === "stage") {
        const stage = byId(data.stages, values.stageId) || stages[0];
        y = addPdfTable(doc, `${stage.code} · ${stage.name}`, pdfRows([stage.id], category), y);
      }

      if (values.pdfType === "all") {
        stages.forEach(stage => {
          if (y > 160) {
            doc.addPage();
            addPdfHeader(doc, event, subtitle);
            y = 48;
          }
          y = addPdfTable(doc, `${stage.code} · ${stage.name}`, pdfRows([stage.id], category), y);
        });
      }

      addPdfFooter(doc);
      const typeName = values.pdfType === "stage" ? "tramo" : values.pdfType === "general" ? "general" : "completo";
      doc.save(`${slug(event.name)}-${typeName}-${slug(categoryLabel)}.pdf`);
      showToast("PDF generado");
    }

    document.addEventListener("click", async event => {
      const loginBtn = event.target.closest("#directorLogin");
      if (loginBtn) {
        if (directorLoggedIn) {
          await logoutDirector();
          return;
        }
        document.getElementById("loginModal").classList.add("show");
        document.getElementById("loginModal").setAttribute("aria-hidden", "false");
        document.querySelector("#loginForm input[name='user']").focus();
        return;
      }

      if (event.target.closest("[data-close-login]") || event.target.id === "loginModal") {
        document.getElementById("loginModal").classList.remove("show");
        document.getElementById("loginModal").setAttribute("aria-hidden", "true");
        return;
      }

      const saveEventBtn = event.target.closest("[data-save-event]");
      if (saveEventBtn) {
        event.preventDefault();
        await saveEventForm(saveEventBtn.closest("form"));
        return;
      }

      const saveActions = [
        ["data-save-driver", saveDriverForm],
        ["data-save-stage", saveStageForm],
        ["data-save-time", saveTimeForm],
        ["data-save-penalty", savePenaltyForm],
        ["data-save-retirement", saveRetirementForm],
        ["data-save-api", saveApiForm]
      ];
      for (const [attr, handler] of saveActions) {
        const button = event.target.closest(`[${attr}]`);
        if (button) {
          event.preventDefault();
          handler(button.closest("form"));
          return;
        }
      }

      const exportPdfBtn = event.target.closest("[data-export-pdf]");
      if (exportPdfBtn) {
        event.preventDefault();
        showToast("Generando PDF...");
        await exportPdf(exportPdfBtn.closest("form"));
        return;
      }

      const importDriversBtn = event.target.closest("[data-import-drivers]");
      if (importDriversBtn) {
        event.preventDefault();
        await importDriversFromExcel(document.getElementById("driverExcelFile"));
        return;
      }

      const homeBtn = event.target.closest("[data-go-home]");
      if (homeBtn) {
        event.preventDefault();
        publicView = "home";
        detailTab = "itinerary";
        selectedStageId = "";
        renderPublic();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const openEventBtn = event.target.closest("[data-open-event]");
      if (openEventBtn) {
        data.activeEventId = openEventBtn.dataset.openEvent;
        publicView = "event";
        detailTab = "itinerary";
        selectedStageId = "";
        renderPublic();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const openStageBtn = event.target.closest("[data-open-stage]");
      if (openStageBtn) {
        selectedStageId = openStageBtn.dataset.openStage;
        publicView = "stage";
        detailTab = "times";
        categoryFilter = "absolute";
        renderPublic();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const backEventBtn = event.target.closest("[data-back-event]");
      if (backEventBtn) {
        publicView = "event";
        renderPublic();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const detailBtn = event.target.closest("[data-detail-tab]");
      if (detailBtn) {
        detailTab = detailBtn.dataset.detailTab;
        if (detailTab === "times") {
          const firstStage = eventStages()[0];
          if (firstStage) {
            selectedStageId = selectedStageId || firstStage.id;
            publicView = "stage";
            categoryFilter = "absolute";
            renderPublic();
            window.scrollTo({ top: 0, behavior: "smooth" });
            return;
          }
        }
        if (publicView === "stage" && detailTab !== "times") publicView = "event";
        renderPublic();
        return;
      }

      const stageBtn = event.target.closest("[data-stage]");
      if (stageBtn) {
        currentStage = stageBtn.dataset.stage;
        renderStageTabs();
        renderClassification();
      }

      const adminBtn = event.target.closest("[data-admin]");
      if (adminBtn) {
        adminView = adminBtn.dataset.admin;
        renderAdmin();
      }

      const actionBtn = event.target.closest("[data-action]");
      if (!actionBtn) return;
      const { action, id } = actionBtn.dataset;

      if (action === "activate-event") { data.activeEventId = id; currentStage = "general"; saveData("Evento publicado"); }
      if (action === "edit-event") fillForm("eventForm", byId(data.events, id));
      if (action === "move-event-up") reorderEvents(id, -1);
      if (action === "move-event-down") reorderEvents(id, 1);
      if (action === "delete-event" && confirm("¿Eliminar evento y todos sus datos?")) {
        data.events = data.events.filter(item => item.id !== id);
        ["drivers","stages","times","penalties","retirements"].forEach(key => data[key] = data[key].filter(item => item.eventId !== id));
        data.activeEventId = data.events[0]?.id || "";
        saveData("Evento eliminado");
      }

      if (action === "edit-driver") fillForm("driverForm", byId(data.drivers, id));
      if (action === "delete-driver" && confirm("¿Eliminar piloto?")) {
        data.drivers = data.drivers.filter(item => item.id !== id);
        data.times = data.times.filter(item => item.driverId !== id);
        data.penalties = data.penalties.filter(item => item.driverId !== id);
        data.retirements = data.retirements.filter(item => item.driverId !== id);
        saveData("Piloto eliminado");
      }

      if (action === "edit-stage") fillForm("stageForm", byId(data.stages, id));
      if (action === "delete-stage" && confirm("¿Eliminar tramo?")) {
        data.stages = data.stages.filter(item => item.id !== id);
        data.times = data.times.filter(item => item.stageId !== id);
        data.penalties = data.penalties.filter(item => item.stageId !== id);
        data.retirements = data.retirements.filter(item => item.stageId !== id);
        saveData("Tramo eliminado");
      }

      if (action === "delete-time") {
        data.times = data.times.filter(item => item.id !== id);
        saveData("Tiempo eliminado");
      }
      if (action === "edit-time") fillForm("timeForm", byId(data.times, id));
      if (action === "edit-penalty") fillForm("penaltyForm", byId(data.penalties, id));
      if (action === "delete-penalty") { data.penalties = data.penalties.filter(item => item.id !== id); saveData("Penalización eliminada"); }
      if (action === "edit-retirement") fillForm("retirementForm", byId(data.retirements, id));
      if (action === "delete-retirement") { data.retirements = data.retirements.filter(item => item.id !== id); saveData("Abandono eliminado"); }
    });

    document.addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.target;
      const values = Object.fromEntries(new FormData(form).entries());

      if (form.id === "loginForm") {
        try {
          await loginDirectorWithSupabase(values.user, values.pass);
          directorLoggedIn = true;
          if (values.remember === "on") {
            localStorage.setItem("directorLoggedIn", "true");
            sessionStorage.removeItem("directorLoggedIn");
          } else {
            sessionStorage.setItem("directorLoggedIn", "true");
            localStorage.removeItem("directorLoggedIn");
          }
          renderDirectorAccess();
          document.getElementById("loginModal").classList.remove("show");
          document.getElementById("loginModal").setAttribute("aria-hidden", "true");
          form.reset();
          showToast("Sesión de director iniciada");
          document.getElementById("direccion").scrollIntoView({ behavior: "smooth" });
        } catch (error) {
          console.warn("Login Supabase fallido", error);
          showToast("Credenciales de Supabase incorrectas");
        }
        return;
      }

      if (form.id === "eventForm") {
        await saveEventForm(form);
      }

      if (form.id === "driverForm") {
        saveDriverForm(form);
      }

      if (form.id === "stageForm") {
        saveStageForm(form);
      }

      if (form.id === "timeForm") {
        saveTimeForm(form);
      }

      if (form.id === "penaltyForm") {
        savePenaltyForm(form);
      }

      if (form.id === "retirementForm") {
        saveRetirementForm(form);
      }

      if (form.id === "apiForm") {
        saveApiForm(form);
      }
    });

    document.addEventListener("input", event => {
      if (event.target.id === "searchInput") renderClassification();
    });

    document.addEventListener("change", event => {
      if (event.target.id === "stageSelect") {
        selectedStageId = event.target.value;
        renderStageDetail();
      }
      if (event.target.id === "categorySelect") {
        categoryFilter = event.target.value;
        renderStageDetail();
      }
    });

    document.addEventListener("click", event => {
      if (event.target.id === "simulateSync") {
        const eventStagesList = eventStages();
        const eventDriversList = eventDrivers().filter(driver => driver.status !== "Abandono");
        if (!eventStagesList.length || !eventDriversList.length) return showToast("Faltan pilotos o tramos");
        const stage = eventStagesList[Math.floor(Math.random() * eventStagesList.length)];
        const driver = eventDriversList[Math.floor(Math.random() * eventDriversList.length)];
        const seconds = 310 + Math.random() * 260;
        const existing = data.times.find(item => item.eventId === activeEventId() && item.driverId === driver.id && item.stageId === stage.id);
        const item = { id: existing?.id || uid("tm"), eventId: activeEventId(), driverId: driver.id, stageId: stage.id, seconds, source: "Assetto API" };
        data.times = existing ? data.times.map(time => time.id === existing.id ? item : time) : [...data.times, item];
        saveData("Sincronización simulada");
      }
    });

    renderAll();
    initSupabaseSync();
  </script>
</body>
</html>
